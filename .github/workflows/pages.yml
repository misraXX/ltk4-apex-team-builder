name: Validate static site
on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check syntax and team allocation rules
        run: |
          node --check site/core.js
          node --check site/app.js
          node --test tests/*.test.cjs
